# Serves the static console and puts the API on the same origin, under /api.
# With one origin, the browser never makes a cross-origin (CORS) request.

server {
    # 8080: the image runs as an unprivileged user, which can't bind ports below 1024
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_types      text/css application/javascript application/json;
    gzip_min_length 1024;

    # /api/gaps/12?x=1 -> http://api:8000/gaps/12?x=1. The address of "api" is looked up
    # through Docker's DNS (127.0.0.11) on each request, not once at startup, so
    # recreating the api container (a new IP) never leaves the console with a 502.
    location /api/ {
        resolver           127.0.0.11 valid=10s ipv6=off;
        set                $api http://api:8000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # No build step means no fingerprinted file names: revalidate on every load so a
    # rebuilt image is picked up without a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
